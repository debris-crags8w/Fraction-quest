name: Voice pack

# Generates missing Kokoro audio (each sentence as Opus in .caf for Apple browsers and the iPhone app, and as an MP3 for everyone else), uploads it to App Storage through the app's server, checks that every indexed
# sentence is stored in every voice, and only then opens a pull request with the small voice index. (Only the
# server can write to App Storage; the repository secrets VOICE_PACK_UPLOAD_URL and VOICE_PACK_UPLOAD_TOKEN let
# this workflow send it the files.) Without those secrets, sync the run's artifact by hand before merging.

on:
  workflow_dispatch:
    inputs:
      rerender:
        description: Re-make every sentence's audio (after an encoding change, such as trimming silence) and upload it
        type: boolean
        default: false
      prune:
        description: Also remove stored audio the voice index on main no longer lists (run after a deploy)
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - artifacts/fraction-quest/src/**
      - artifacts/fraction-quest/scripts/voice-sentences.ts
      # Merging an audio pull request checks once more for text that changed while it was open.
      - artifacts/fraction-quest/public/voice/index.json
      - "!artifacts/fraction-quest/src/**/*.test.ts"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: voice-pack
  cancel-in-progress: false

jobs:
  sentences:
    name: List sentences
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      missing: ${{ steps.check.outputs.missing }}
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: List every fixed sentence
        working-directory: artifacts/fraction-quest
        run: |
          pnpm exec tsx scripts/voice-sentences.ts > "$RUNNER_TEMP/sentences.json"
      - name: Find missing and removed sentences
        id: check
        working-directory: artifacts/fraction-quest
        env:
          GH_TOKEN: ${{ github.token }}
          RERENDER: ${{ github.event_name == 'workflow_dispatch' && inputs.rerender }}
        run: |
          # One audio pull request at a time: while one is open, its audio isn't on main yet, so wait for it.
          open=$(gh pr list --state open --search "head:voice-pack" --json number --jq 'length' || echo 0)
          if [ "$open" != "0" ]; then
            echo "::notice::A voice pack pull request is still open. Merge it; that starts the next check."
            echo "missing=0" >> "$GITHUB_OUTPUT"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node -e '
            const fs = require("fs");
            const list = require(process.argv[1]);
            const previousPath = "public/voice/index.json";
            const previous = fs.existsSync(previousPath) ? JSON.parse(fs.readFileSync(previousPath, "utf8")) : { keys: [] };
            const previousKeys = new Set(previous.keys || []);
            const currentKeys = new Set(list.map((s) => s.key));
            // A re-render makes every sentence again; the index itself stays the same.
            const missing = process.env.RERENDER === "true" ? list : list.filter((s) => !previousKeys.has(s.key));
            const removed = [...previousKeys].filter((key) => !currentKeys.has(key));
            fs.writeFileSync(process.argv[2], JSON.stringify(missing));
            fs.writeFileSync(process.argv[3], JSON.stringify({ version: 1, voices: previous.voices || [], keys: [...previousKeys] }));
            console.error(`${list.length} sentences, ${missing.length} need audio, ${removed.length} are no longer used`);
            fs.writeFileSync(process.argv[4], String(missing.length));
            fs.writeFileSync(process.argv[5], String(missing.length > 0 || removed.length > 0));
          ' "$RUNNER_TEMP/sentences.json" "$RUNNER_TEMP/missing-sentences.json" "$RUNNER_TEMP/previous-index.json" "$RUNNER_TEMP/missing-count" "$RUNNER_TEMP/has-changes"
          missing=$(cat "$RUNNER_TEMP/missing-count")
          changed=$(cat "$RUNNER_TEMP/has-changes")
          echo "missing=$missing" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: sentences
          path: |
            ${{ runner.temp }}/sentences.json
            ${{ runner.temp }}/missing-sentences.json
            ${{ runner.temp }}/previous-index.json

  render:
    name: Render ${{ matrix.voice }} (${{ matrix.shard }}/4)
    needs: sentences
    if: needs.sentences.outputs.missing != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        voice: [af_heart]
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: sentences
          path: ${{ runner.temp }}
      - name: Install ffmpeg (the MP3 encoder)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && ffmpeg -version | head -1
      - name: Make the missing clips (Opus and MP3)
        working-directory: artifacts/api-server
        run: |
          touch "$RUNNER_TEMP/started"
          pnpm exec tsx scripts/render-voice-pack.ts "$RUNNER_TEMP/missing-sentences.json" ../fraction-quest/public/voice ${{ matrix.voice }} ${{ matrix.shard }} 4
          mkdir -p "$RUNNER_TEMP/new/${{ matrix.voice }}"
          find ../fraction-quest/public/voice/${{ matrix.voice }} \( -name '*.mp3' -o -name '*.caf' \) -newer "$RUNNER_TEMP/started" -exec cp {} "$RUNNER_TEMP/new/${{ matrix.voice }}/" \;
          echo "New files: $(ls "$RUNNER_TEMP/new/${{ matrix.voice }}" | wc -l)"
      - uses: actions/upload-artifact@v4
        with:
          name: voice-${{ matrix.voice }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/new
          if-no-files-found: ignore
          retention-days: 3

  publish:
    name: Prepare an index-only pull request
    needs: [sentences, render]
    if: ${{ !cancelled() && needs.sentences.outputs.changed == 'true' && (needs.render.result == 'success' || needs.render.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: sentences
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v4
        if: needs.sentences.outputs.missing != '0'
        with:
          pattern: voice-*
          path: artifacts/fraction-quest/public/voice
          merge-multiple: true
      - name: Write the next index
        working-directory: artifacts/fraction-quest
        run: |
          pnpm exec tsx scripts/voice-pack-index.ts "$RUNNER_TEMP/sentences.json" public/voice "$RUNNER_TEMP/previous-index.json" | tee "$RUNNER_TEMP/summary.txt"
      - name: Store generated MP3s as a temporary workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: voice-pack-${{ github.run_id }}
          path: artifacts/fraction-quest/public/voice
          retention-days: 30
      - name: Upload the new audio to App Storage
        id: upload
        working-directory: artifacts/api-server
        env:
          VOICE_PACK_UPLOAD_URL: ${{ secrets.VOICE_PACK_UPLOAD_URL }}
          VOICE_PACK_UPLOAD_TOKEN: ${{ secrets.VOICE_PACK_UPLOAD_TOKEN }}
        run: |
          if [ -z "$VOICE_PACK_UPLOAD_URL" ] || [ -z "$VOICE_PACK_UPLOAD_TOKEN" ]; then
            echo "::warning::VOICE_PACK_UPLOAD_URL and VOICE_PACK_UPLOAD_TOKEN are not set, so the audio was not uploaded. Sync the artifact by hand before merging."
            echo "uploaded=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fails (and opens no pull request) unless every indexed sentence ends up stored in every voice.
          pnpm exec tsx scripts/upload-voice-pack.ts ../fraction-quest/public/voice
          echo "uploaded=true" >> "$GITHUB_OUTPUT"
      - name: Commit and open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOADED: ${{ steps.upload.outputs.uploaded }}
        run: |
          git add artifacts/fraction-quest/public/voice/index.json
          if git diff --cached --quiet; then echo "The voice pack is already up to date."; exit 0; fi
          branch="voice-pack/${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -q -m "Update the pre-made voice pack" -m "$(cat "$RUNNER_TEMP/summary.txt")"
          git push -u origin "$branch"
          if [ "$UPLOADED" = "true" ]; then
            storage_note="The audio is already in App Storage: the workflow uploaded it and checked that every sentence in this index is stored in every voice. Safe to merge."
          else
            storage_note="**Before merging:** download the \`voice-pack-${{ github.run_id }}\` artifact from [this workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) and sync it to App Storage with \`pnpm --filter @workspace/api-server run sync-voice-pack -- <artifact-directory>\`."
          fi
          gh pr create --base main --head "$branch" --title "Update the pre-made voice pack index" \
            --body "Made by the Voice pack workflow (run ${{ github.run_id }}).

          $storage_note

          \`\`\`
          $(cat "$RUNNER_TEMP/summary.txt")
          \`\`\`" \
            || echo "::warning::Pushed $branch but could not open the pull request. Open it from the branch page, or allow GitHub Actions to create pull requests in the repository settings."
          gh workflow run pull-request-checks.yml --ref "$branch" || echo "::warning::Could not dispatch the required pull request checks."

  prune:
    name: Remove unused stored audio
    if: github.event_name == 'workflow_dispatch' && inputs.prune
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Only by hand, after the app is deployed with the current index: the live app must no longer list them.
      - name: Check the index on main and remove what it no longer lists
        working-directory: artifacts/api-server
        env:
          VOICE_PACK_UPLOAD_URL: ${{ secrets.VOICE_PACK_UPLOAD_URL }}
          VOICE_PACK_UPLOAD_TOKEN: ${{ secrets.VOICE_PACK_UPLOAD_TOKEN }}
        run: pnpm exec tsx scripts/upload-voice-pack.ts ../fraction-quest/public/voice --check-only --prune
