name: Voice pack

# Keeps App Storage holding the audio for every sentence the app reads aloud: each made once by Kokoro, as Opus in
# .caf (Apple browsers and the iPhone app) and as MP3 (everyone else). It runs on every pull request, before it
# merges: it sends the current sentence list to the Replit API, which checks App Storage, makes only a small
# number of missing clips with Kokoro, and verifies storage. (Make "Voice audio is in App Storage" a required
# check.) Replit owns the model and App Storage; GitHub never renders or uploads audio. The voice index is generated
# from the app's text and is not committed.

on:
  # Every pull request (a required check must always report); one that changes no sentence finishes in a minute.
  pull_request:
    branches:
      - main
  # A safety net after merging: Replit checks for missing audio again.
  push:
    branches:
      - main
    paths:
      - artifacts/fraction-quest/src/**
      - artifacts/fraction-quest/scripts/voice-sentences.ts
      - "!artifacts/fraction-quest/src/**/*.test.ts"
  workflow_dispatch:
    inputs:
      prune:
        description: Also remove stored audio the app no longer uses (run after a deploy)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: voice-pack-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Build voice sentence manifest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      skip: ${{ steps.plan.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Mark fork pull requests (secrets are not available to forks)
        id: plan
        env:
          FORK: ${{ github.event.pull_request.head.repo.fork == true }}
        run: |
          if [ "$FORK" = "true" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
      - name: List every sentence the app reads aloud
        working-directory: artifacts/fraction-quest
        run: |
          pnpm exec tsx scripts/voice-sentences.ts > "$RUNNER_TEMP/sentences.json"
          pnpm exec tsx scripts/voice-pack-index.ts "$RUNNER_TEMP/index.json"
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.skip != 'true'
        with:
          name: sentences
          path: |
            ${{ runner.temp }}/index.json
            ${{ runner.temp }}/sentences.json
          retention-days: 3

  store:
    # The required check: passes only when App Storage has every sentence of this code in every format.
    name: Voice audio is in App Storage
    needs: [plan]
    # Always report (a skipped required check would count as passing).
    if: ${{ always() && needs.plan.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Stop if planning failed
        if: needs.plan.result != 'success'
        run: |
          echo "::error::Building the voice sentence list failed (plan: ${{ needs.plan.result }})."
          exit 1
      - name: Skip for pull requests from forks
        if: needs.plan.outputs.skip == 'true'
        run: echo "::notice::Not checked for a fork; the voice audio is made after merging."
      - uses: actions/checkout@v4
        if: needs.plan.outputs.skip != 'true'
      - uses: pnpm/action-setup@v4
        if: needs.plan.outputs.skip != 'true'
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        if: needs.plan.outputs.skip != 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: needs.plan.outputs.skip != 'true'
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.skip != 'true'
        with:
          name: sentences
          path: ${{ runner.temp }}
      - name: Ask Replit to generate missing audio and verify App Storage
        if: needs.plan.outputs.skip != 'true'
        working-directory: artifacts/api-server
        env:
          VOICE_PACK_UPLOAD_URL: ${{ secrets.VOICE_PACK_UPLOAD_URL }}
          VOICE_PACK_UPLOAD_TOKEN: ${{ secrets.VOICE_PACK_UPLOAD_TOKEN }}
        run: |
          if [ -z "$VOICE_PACK_UPLOAD_URL" ] || [ -z "$VOICE_PACK_UPLOAD_TOKEN" ]; then
            echo "::error::Set GitHub secrets VOICE_PACK_UPLOAD_URL (published app base URL) and VOICE_PACK_UPLOAD_TOKEN, and set the matching token in Replit Secrets."
            exit 1
          fi
          pnpm exec tsx scripts/upload-voice-pack.ts sync "$RUNNER_TEMP/sentences.json" "$RUNNER_TEMP/index.json"

  prune:
    name: Remove unused stored audio
    if: github.event_name == 'workflow_dispatch' && inputs.prune
    needs: store
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Only by hand, after the app is deployed from this code: the live app must no longer use those files.
      - name: Remove stored audio the app no longer uses
        working-directory: artifacts/api-server
        env:
          VOICE_PACK_UPLOAD_URL: ${{ secrets.VOICE_PACK_UPLOAD_URL }}
          VOICE_PACK_UPLOAD_TOKEN: ${{ secrets.VOICE_PACK_UPLOAD_TOKEN }}
        run: |
          (cd ../fraction-quest && pnpm exec tsx scripts/voice-pack-index.ts "$RUNNER_TEMP/index.json")
          pnpm exec tsx scripts/upload-voice-pack.ts check "$RUNNER_TEMP/index.json" --prune
