name: Voice pack

# Generates missing Kokoro audio and attaches it to the workflow run as a temporary artifact. Only the small
# voice index is committed in the pull request; sync the artifact to App Storage before merging that pull request.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - artifacts/fraction-quest/src/**
      - artifacts/fraction-quest/scripts/voice-sentences.ts
      # Merging an audio pull request checks once more for text that changed while it was open.
      - artifacts/fraction-quest/public/voice/index.json
      - "!artifacts/fraction-quest/src/**/*.test.ts"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: voice-pack
  cancel-in-progress: false

jobs:
  sentences:
    name: List sentences
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      missing: ${{ steps.check.outputs.missing }}
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: List every fixed sentence
        working-directory: artifacts/fraction-quest
        run: |
          pnpm exec tsx scripts/voice-sentences.ts > "$RUNNER_TEMP/sentences.json"
      - name: Find missing and removed sentences
        id: check
        working-directory: artifacts/fraction-quest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One audio pull request at a time: while one is open, its audio isn't on main yet, so wait for it.
          open=$(gh pr list --state open --search "head:voice-pack" --json number --jq 'length' || echo 0)
          if [ "$open" != "0" ]; then
            echo "::notice::A voice pack pull request is still open. Merge it; that starts the next check."
            echo "missing=0" >> "$GITHUB_OUTPUT"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node -e '
            const fs = require("fs");
            const list = require(process.argv[1]);
            const previousPath = "public/voice/index.json";
            const previous = fs.existsSync(previousPath) ? JSON.parse(fs.readFileSync(previousPath, "utf8")) : { keys: [] };
            const previousKeys = new Set(previous.keys || []);
            const currentKeys = new Set(list.map((s) => s.key));
            const missing = list.filter((s) => !previousKeys.has(s.key));
            const removed = [...previousKeys].filter((key) => !currentKeys.has(key));
            fs.writeFileSync(process.argv[2], JSON.stringify(missing));
            fs.writeFileSync(process.argv[3], JSON.stringify({ version: 1, voices: previous.voices || [], keys: [...previousKeys] }));
            console.error(`${list.length} sentences, ${missing.length} need audio, ${removed.length} are no longer used`);
            fs.writeFileSync(process.argv[4], String(missing.length));
            fs.writeFileSync(process.argv[5], String(missing.length > 0 || removed.length > 0));
          ' "$RUNNER_TEMP/sentences.json" "$RUNNER_TEMP/missing-sentences.json" "$RUNNER_TEMP/previous-index.json" "$RUNNER_TEMP/missing-count" "$RUNNER_TEMP/has-changes"
          missing=$(cat "$RUNNER_TEMP/missing-count")
          changed=$(cat "$RUNNER_TEMP/has-changes")
          echo "missing=$missing" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: sentences
          path: |
            ${{ runner.temp }}/sentences.json
            ${{ runner.temp }}/missing-sentences.json
            ${{ runner.temp }}/previous-index.json

  render:
    name: Render ${{ matrix.voice }} (${{ matrix.shard }}/4)
    needs: sentences
    if: needs.sentences.outputs.missing != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        voice: [af_heart, am_michael, bf_emma]
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: sentences
          path: ${{ runner.temp }}
      - name: Install ffmpeg (the MP3 encoder)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && ffmpeg -version | head -1
      - name: Make the missing MP3s
        working-directory: artifacts/api-server
        run: |
          touch "$RUNNER_TEMP/started"
          pnpm exec tsx scripts/render-voice-pack.ts "$RUNNER_TEMP/missing-sentences.json" ../fraction-quest/public/voice ${{ matrix.voice }} ${{ matrix.shard }} 4
          mkdir -p "$RUNNER_TEMP/new/${{ matrix.voice }}"
          find ../fraction-quest/public/voice/${{ matrix.voice }} -name '*.mp3' -newer "$RUNNER_TEMP/started" -exec cp {} "$RUNNER_TEMP/new/${{ matrix.voice }}/" \;
          echo "New files: $(ls "$RUNNER_TEMP/new/${{ matrix.voice }}" | wc -l)"
      - uses: actions/upload-artifact@v4
        with:
          name: voice-${{ matrix.voice }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/new
          if-no-files-found: ignore
          retention-days: 3

  publish:
    name: Prepare an index-only pull request
    needs: [sentences, render]
    if: ${{ !cancelled() && needs.sentences.outputs.changed == 'true' && (needs.render.result == 'success' || needs.render.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: sentences
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v4
        if: needs.sentences.outputs.missing != '0'
        with:
          pattern: voice-*
          path: artifacts/fraction-quest/public/voice
          merge-multiple: true
      - name: Write the next index
        working-directory: artifacts/fraction-quest
        run: |
          pnpm exec tsx scripts/voice-pack-index.ts "$RUNNER_TEMP/sentences.json" public/voice "$RUNNER_TEMP/previous-index.json" | tee "$RUNNER_TEMP/summary.txt"
      - name: Store generated MP3s as a temporary workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: voice-pack-${{ github.run_id }}
          path: artifacts/fraction-quest/public/voice
          retention-days: 30
      - name: Commit and open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add artifacts/fraction-quest/public/voice/index.json
          if git diff --cached --quiet; then echo "The voice pack is already up to date."; exit 0; fi
          branch="voice-pack/${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -q -m "Update the pre-made voice pack" -m "$(cat "$RUNNER_TEMP/summary.txt")"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" --title "Update the pre-made voice pack index" \
            --body "Made by the Voice pack workflow (run ${{ github.run_id }}).

          **Before merging:** download the \`voice-pack-${{ github.run_id }}\` artifact from [this workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) and sync it to App Storage with \`pnpm --filter @workspace/api-server run sync-voice-pack -- <artifact-directory>\`.

          \`\`\`
          $(cat "$RUNNER_TEMP/summary.txt")
          \`\`\`" \
            || echo "::warning::Pushed $branch but could not open the pull request. Open it from the branch page, or allow GitHub Actions to create pull requests in the repository settings."
          gh workflow run pull-request-checks.yml --ref "$branch" || echo "::warning::Could not dispatch the required pull request checks."
