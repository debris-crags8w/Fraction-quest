name: Pull request checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  # The voice pack workflow starts these for the audio pull requests it opens, since GitHub does not run
  # pull_request checks for pull requests opened by a workflow.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pull-request-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests, typecheck, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fraction_quest_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fraction_quest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fraction_quest_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run API tests
        run: pnpm --filter @workspace/api-server test

      - name: Build shared TypeScript declarations
        run: pnpm run typecheck:libs

      - name: Typecheck API
        run: pnpm --filter @workspace/api-server typecheck

      - name: Build API for production
        run: pnpm --filter @workspace/api-server build

  web:
    name: Web tests, typecheck, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PORT: 4173
      BASE_PATH: /
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run web unit tests
        run: pnpm --filter @workspace/fraction-quest test

      - name: Build shared TypeScript declarations
        run: pnpm run typecheck:libs

      - name: Typecheck web
        run: pnpm --filter @workspace/fraction-quest typecheck

      - name: Build web for production
        run: pnpm --filter @workspace/fraction-quest build

  all-lessons-e2e:
    name: All lessons Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        # The runner's Microsoft apt source has answered 403 ("no longer signed") and stalled installs past the job
        # limit; the browser's packages don't need it. A capped install, tried twice, fails fast instead.
        timeout-minutes: 13
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources
          for try in 1 2; do
            timeout 330 pnpm --filter @workspace/fraction-quest exec playwright install --with-deps chromium && exit 0
            echo "Install attempt $try did not finish; trying again."
            # A stopped install can leave apt-get running and holding the package lock: stop it, wait for the lock,
            # and finish any half-configured packages. Downloaded packages stay cached, so the retry is quicker.
            sudo pkill -x apt-get || true
            for wait in $(seq 1 30); do sudo fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock >/dev/null 2>&1 || break; sleep 2; done
            sudo dpkg --configure -a || true
            # The runner's Azure mirror (listed in apt-mirrors.txt) is sometimes very slow: retry from the main Ubuntu mirror.
            sudo sed -i 's#http://azure.archive.ubuntu.com#http://archive.ubuntu.com#g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          done
          exit 1

      - name: Open every lesson and answer its first question
        run: pnpm --filter @workspace/fraction-quest test:e2e:all-lessons

      - name: Run focused lesson interaction checks
        run: pnpm --filter @workspace/fraction-quest test:e2e:lesson-interactions

      - name: Play every story film on a phone, with and without motion
        run: pnpm --filter @workspace/fraction-quest test:e2e:films

  extra-browser-checks:
    # A separate job, so the required checks above keep their names and their time. It runs the browser checks that had
    # no job of their own: the accessibility scans (axe), the grown-ups report, the subscription screens, offline use,
    # the reminder and the time limit. Expect about EXTRA_MINUTES extra runner minutes on every pull request.
    name: Extra browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        # @axe-core/playwright is a dev dependency of the web app, so the frozen install brings it in.
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        # Same capped, retried install as the all-lessons job (see the note there).
        timeout-minutes: 13
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources
          for try in 1 2; do
            timeout 330 pnpm --filter @workspace/fraction-quest exec playwright install --with-deps chromium && exit 0
            echo "Install attempt $try did not finish; trying again."
            sudo pkill -x apt-get || true
            for wait in $(seq 1 30); do sudo fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock >/dev/null 2>&1 || break; sleep 2; done
            sudo dpkg --configure -a || true
            sudo sed -i 's#http://azure.archive.ubuntu.com#http://archive.ubuntu.com#g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          done
          exit 1

      - name: Accessibility, grown-ups report, subscription, offline, reminder and time-limit checks
        run: pnpm --filter @workspace/fraction-quest test:e2e:extra

  iphone-safari-e2e:
    name: iPhone Safari lesson smoke (WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright WebKit
        # The runner's Microsoft apt source has answered 403 ("no longer signed") and stalled installs past the job
        # limit; the browser's packages don't need it. A capped install, tried twice, fails fast instead.
        timeout-minutes: 13
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources
          for try in 1 2; do
            timeout 330 pnpm --filter @workspace/fraction-quest exec playwright install --with-deps webkit && exit 0
            echo "Install attempt $try did not finish; trying again."
            # A stopped install can leave apt-get running and holding the package lock: stop it, wait for the lock,
            # and finish any half-configured packages. Downloaded packages stay cached, so the retry is quicker.
            sudo pkill -x apt-get || true
            for wait in $(seq 1 30); do sudo fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock >/dev/null 2>&1 || break; sleep 2; done
            sudo dpkg --configure -a || true
            # The runner's Azure mirror (listed in apt-mirrors.txt) is sometimes very slow: retry from the main Ubuntu mirror.
            sudo sed -i 's#http://azure.archive.ubuntu.com#http://archive.ubuntu.com#g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          done
          exit 1

      - name: Open lessons and answer questions at an iPhone viewport
        run: pnpm --filter @workspace/fraction-quest test:e2e:iphone-safari

  ios-typecheck:
    name: iOS package typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck iOS package
        run: pnpm --filter @workspace/fraction-quest-ios typecheck
