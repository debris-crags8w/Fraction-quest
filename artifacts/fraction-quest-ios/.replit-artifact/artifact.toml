kind = "mobile"
previewPath = "/fraction-quest-ios/"
title = "Fraction Quest iOS"
description = "The Fraction Quest iPhone app: a native Expo shell that shows the live web app, so every lesson and fix stays in sync. Adds the iPhone print sheet, haptic taps on answers, and opens outside links in Safari."
version = "1.0.0"
id = "artifacts/fraction-quest-ios"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/fraction-quest-ios/" ]
localPort = 20785

[services.development]
run = "pnpm --filter @workspace/fraction-quest-ios run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fraction-quest-ios", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/fraction-quest-ios", "run", "serve" ]

[services.env]
PORT = "20785"
BASE_PATH = "/fraction-quest-ios/"
