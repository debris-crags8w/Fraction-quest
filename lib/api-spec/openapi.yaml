openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Student accounts and sign-in
  - name: progress
    description: Saved course progress for the signed-in student
  - name: privacy
    description: Parent consent and learner-data controls
  - name: family
    description: Family learner profiles and educator classrooms
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/signup:
    post:
      operationId: signup
      tags: [auth]
      summary: Create an account
      description: Creates a student account and signs it in with a session cookie. The response includes a one-time recovery code to keep on paper.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserWithRecoveryCode"
        "400":
          description: Invalid username, name or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Username already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Missing username or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Wrong username or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/recover:
    post:
      operationId: recoverAccount
      tags: [auth]
      summary: Reset a forgotten password with the recovery code
      description: Sets a new password, signs out every other device, signs in here, and replaces the used recovery code with a new one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoverAccountInput"
      responses:
        "200":
          description: Password reset and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserWithRecoveryCode"
        "400":
          description: Missing fields or password too short
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Username and recovery code don't match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/recovery-code:
    post:
      operationId: newRecoveryCode
      tags: [auth]
      summary: Make a new recovery code (the old one stops working)
      responses:
        "200":
          description: The new code, shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCode"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/password:
    post:
      operationId: setPassword
      tags: [auth]
      summary: Set a new password from a signed-in device (a grown-up's reset)
      description: Signs out every other device.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPasswordInput"
      responses:
        "204":
          description: Password changed
        "400":
          description: Password too short or too long
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out
      responses:
        "204":
          description: Signed out
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: The signed-in student
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /privacy/consent:
    patch:
      operationId: acceptPrivacyConsent
      tags: [privacy]
      summary: Record adult caregiver consent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentInput"
      responses:
        "200":
          description: Consent recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Consent was not accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /privacy/export:
    get:
      operationId: exportPrivacyData
      tags: [privacy]
      summary: Export the signed-in account's saved learning data
      responses:
        "200":
          description: Account and learner data, excluding password hashes and session credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacyExport"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /privacy/account:
    delete:
      operationId: deleteAccount
      tags: [privacy]
      summary: Permanently delete the signed-in account and all of its learners, classrooms and progress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteAccountInput"
      responses:
        "204":
          description: The account and all of its data were deleted, and the session ended
        "400":
          description: Missing password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Wrong password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /family/profiles:
    get:
      operationId: listLearnerProfiles
      tags: [family]
      summary: List learner profiles owned by the signed-in account
      responses:
        "200":
          description: Learner profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LearnerProfile"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createLearnerProfile
      tags: [family]
      summary: Add a learner profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearnerProfileInput"
      responses:
        "201":
          description: Learner profile created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearnerProfile"
        "400":
          description: Invalid learner name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /family/profiles/{profileId}:
    patch:
      operationId: updateLearnerProfile
      tags: [family]
      summary: Change a learner nickname with adult approval
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearnerProfileUpdate"
      responses:
        "200":
          description: Updated learner profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearnerProfile"
        "400":
          description: Invalid profile name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Profile not found for this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteLearnerProfile
      tags: [family]
      summary: Delete a learner profile and its saved data
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Profile and saved data deleted
        "404":
          description: Profile not found for this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /family/profiles/{profileId}/progress:
    get:
      operationId: getLearnerProgress
      tags: [family, progress]
      summary: Load saved learning data for one profile
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Saved profile progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedProgress"
        "404":
          description: Profile not found for this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: saveLearnerProgress
      tags: [family, progress]
      summary: Save learning data for one profile
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressPayload"
      responses:
        "200":
          description: Saved profile progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedProgress"
        "400":
          description: Invalid progress data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Profile not found for this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteLearnerProgress
      tags: [family, privacy]
      summary: Delete only one learner's saved progress and preferences
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Saved profile progress deleted
        "404":
          description: Profile not found for this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /classrooms:
    get:
      operationId: listClassrooms
      tags: [family]
      summary: List classrooms owned by the signed-in educator
      responses:
        "200":
          description: Owned classrooms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Classroom"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createClassroom
      tags: [family]
      summary: Create a class with a shareable code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassroomInput"
      responses:
        "201":
          description: Classroom created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Classroom"
        "400":
          description: Invalid classroom label
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /classrooms/join:
    post:
      operationId: joinClassroom
      tags: [family]
      summary: Link one learner profile to a classroom using its code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassroomJoinInput"
      responses:
        "200":
          description: Profile linked to the classroom
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassroomMembership"
        "400":
          description: Invalid or unknown classroom code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Learner profile not found for this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /classrooms/{classroomId}/roster:
    get:
      operationId: getClassroomRoster
      tags: [family]
      summary: Review progress using anonymous learner codes
      parameters:
        - name: classroomId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Anonymous progress rows for the educator's classroom
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClassroomLearner"
        "404":
          description: Classroom not found for this educator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /classrooms/{classroomId}/learners/{memberCode}/assignment:
    put:
      operationId: assignClassroomUnits
      tags: [family]
      summary: Assign units to one anonymous learner
      parameters:
        - name: classroomId
          in: path
          required: true
          schema:
            type: integer
        - name: memberCode
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnitAssignmentInput"
      responses:
        "200":
          description: Assignment saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnitAssignment"
        "400":
          description: Invalid unit assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Classroom or learner not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /progress:
    get:
      operationId: getProgress
      tags: [progress]
      summary: Load saved progress
      responses:
        "200":
          description: Saved progress (empty fields if nothing saved yet)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedProgress"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: saveProgress
      tags: [progress]
      summary: Save progress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressPayload"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedProgress"
        "400":
          description: Invalid progress data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        displayName:
          type: string
        parentConsentAt:
          type: ["string", "null"]
          format: date-time
        privacyNoticeVersion:
          type: ["string", "null"]
        hasRecoveryCode:
          type: boolean
      required:
        - id
        - username
        - displayName
        - parentConsentAt
        - privacyNoticeVersion
        - hasRecoveryCode
    UserWithRecoveryCode:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        displayName:
          type: string
        parentConsentAt:
          type: ["string", "null"]
          format: date-time
        privacyNoticeVersion:
          type: ["string", "null"]
        hasRecoveryCode:
          type: boolean
        recoveryCode:
          type: string
      required:
        - id
        - username
        - displayName
        - parentConsentAt
        - privacyNoticeVersion
        - hasRecoveryCode
        - recoveryCode
    RecoveryCode:
      type: object
      properties:
        recoveryCode:
          type: string
      required: [recoveryCode]
    RecoverAccountInput:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 40
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 40
        newPassword:
          type: string
          minLength: 8
          maxLength: 72
      required: [username, recoveryCode, newPassword]
    SetPasswordInput:
      type: object
      properties:
        newPassword:
          type: string
          minLength: 8
          maxLength: 72
      required: [newPassword]
    SignupRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 20
          pattern: "^[A-Za-z0-9_]+$"
        displayName:
          type: string
          minLength: 1
          maxLength: 30
        password:
          type: string
          minLength: 8
          maxLength: 72
        parentConsent:
          type: boolean
      required:
        - username
        - displayName
        - password
        - parentConsent
    DeleteAccountInput:
      type: object
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 200
      required: [password]
    ConsentInput:
      type: object
      properties:
        accepted:
          type: boolean
      required: [accepted]
    LearnerProfile:
      type: object
      properties:
        id:
          type: integer
        displayName:
          type: string
        classroomId:
          type: ["integer", "null"]
        memberCode:
          type: ["string", "null"]
        assignedUnitIds:
          type: array
          items: { type: string }
      required: [id, displayName, classroomId, memberCode, assignedUnitIds]
    LearnerProfileInput:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 30
      required: [displayName]
    LearnerProfileUpdate:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 30
      required: [displayName]
    Classroom:
      type: object
      properties:
        id: { type: integer }
        label: { type: string }
        joinCode: { type: string }
        learnerCount: { type: integer }
        createdAt: { type: string, format: date-time }
      required: [id, label, joinCode, learnerCount, createdAt]
    ClassroomInput:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 60
      required: [label]
    ClassroomJoinInput:
      type: object
      properties:
        profileId: { type: integer }
        joinCode:
          type: string
          minLength: 6
          maxLength: 16
      required: [profileId, joinCode]
    ClassroomMembership:
      type: object
      properties:
        classroomLabel: { type: string }
        memberCode: { type: string }
        assignedUnitIds:
          type: array
          items: { type: string }
      required: [classroomLabel, memberCode, assignedUnitIds]
    ClassroomLearner:
      type: object
      properties:
        memberCode: { type: string }
        assignedUnitIds:
          type: array
          items: { type: string }
        completedMissionIds:
          type: array
          items: { type: string }
        updatedAt: { type: string, format: date-time }
      required: [memberCode, assignedUnitIds, completedMissionIds, updatedAt]
    UnitAssignmentInput:
      type: object
      properties:
        unitIds:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 100 }
      required: [unitIds]
    UnitAssignment:
      type: object
      properties:
        memberCode: { type: string }
        unitIds:
          type: array
          items: { type: string }
      required: [memberCode, unitIds]
    LearnerExport:
      type: object
      properties:
        id: { type: integer }
        displayName: { type: string }
        classroomLabel: { type: ["string", "null"] }
        memberCode: { type: ["string", "null"] }
        assignedUnitIds:
          type: array
          items: { type: string }
        progress: { type: object, additionalProperties: true }
        fun: { type: object, additionalProperties: true }
        updatedAt: { type: string, format: date-time }
      required: [id, displayName, classroomLabel, memberCode, assignedUnitIds, progress, fun, updatedAt]
    PrivacyExport:
      type: object
      properties:
        exportedAt: { type: string, format: date-time }
        account:
          type: object
          properties:
            username: { type: string }
            displayName: { type: string }
            createdAt: { type: string, format: date-time }
            parentConsentAt: { type: ["string", "null"], format: date-time }
            privacyNoticeVersion: { type: ["string", "null"] }
          required: [username, displayName, createdAt, parentConsentAt, privacyNoticeVersion]
        learners:
          type: array
          items: { $ref: "#/components/schemas/LearnerExport" }
        classrooms:
          type: array
          items: { $ref: "#/components/schemas/Classroom" }
      required: [exportedAt, account, learners, classrooms]
    LoginRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 20
        password:
          type: string
          minLength: 1
          maxLength: 72
      required:
        - username
        - password
    ProgressPayload:
      type: object
      properties:
        progress:
          type: object
          additionalProperties: true
        fun:
          type: object
          additionalProperties: true
      required:
        - progress
        - fun
    SavedProgress:
      type: object
      properties:
        progress:
          type: ["object", "null"]
          additionalProperties: true
        fun:
          type: ["object", "null"]
          additionalProperties: true
        updatedAt:
          type: ["string", "null"]
          format: date-time
      required:
        - progress
        - fun
        - updatedAt
